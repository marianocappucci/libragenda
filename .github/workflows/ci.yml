name: CI

on:
  # F3 (2026-09-05): sin `push`. Los tags no disparan nada mas que esta misma
  # suite sobre un commit que el PR de promocion ya probo (no hay job de
  # release), y el push a develop/main duplicaba el run del PR. Medido en la
  # auditoria de F3, ver el wiki.
  # Sin `push` a ramas: `develop` y `main` estan protegidas (2026-08-11,
  # `enforce_admins: true`), asi que todo entra por PR y el run del PR verifica
  # el MERGE -- que es exactamente lo que queda en la rama. El push repetia esa
  # misma verificacion sobre un arbol identico: medido, tres commits distintos
  # con el mismo tree hash y hasta cuatro corridas por cambio.
  pull_request:
    branches: [develop, main]

# Una sola corrida viva por rama. Si entra un push nuevo mientras esta
# corriendo, se cancela la anterior en vez de pagar las dos: su resultado ya
# no le sirve a nadie, porque reporta sobre un codigo que no es el que quedo
# en la rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: libragenda
          POSTGRES_USER: libragenda_ci
          POSTGRES_PASSWORD: libragenda_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libragenda_ci -d libragenda"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://libragenda_ci:libragenda_ci_only@localhost:5432/libragenda

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # F1 (2026-09-05): el entorno sale de `uv.lock`, no de la resolucion del dia.
      # `--locked` falla si el lock no coincide con pyproject.toml: un pin que se
      # mueve sin regenerar el lock pone rojo aca, no en produccion. El venv entra
      # al PATH para que los pasos siguientes (ruff, pytest, alembic, scripts)
      # sigan invocandose igual que antes.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
      - name: Install package + dev deps (uv.lock)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Lint antes que los tests: tarda segundos y su rojo se lee mucho mas
      # facil que el de una suite. El ruleset vive en pyproject.toml y esta
      # CURADO para dar cero hallazgos hoy en los 12 repos de la familia --
      # ver el comentario largo ahi. Un rojo aca es una regresion, no deuda.
      - name: Lint (ruff)
        run: ruff check .

      # Que el gate de PostgreSQL no se saltee en silencio. `test_postgres_real`
      # y `test_migrations` se auto-saltean sin `DATABASE_URL`, que es lo
      # correcto para una corrida local -- pero en CI un salteo se lee como
      # verde y el gate no estaria probando nada. Si el servicio no levanto,
      # esto falla aca y lo dice, en vez de dejar pasar la suite entera.
      - name: Verificar que el PostgreSQL del CI responde
        run: |
          python - <<'PY'
          import os, sys
          import psycopg
          url = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(url) as c:
              v = c.execute("select version()").fetchone()[0]
          print(v)
          if "PostgreSQL" not in v:
              sys.exit("el servicio no contesto como PostgreSQL")
          PY

      # `--cov` sin argumento toma el paquete de [tool.coverage.run] del
      # pyproject. El piso (fail_under) tambien esta ahi: es un trinquete
      # fijado 2 puntos debajo de lo medido el 2026-07-31, no una meta.
      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing

      # Contraprueba del salteo: que los tests contra PostgreSQL real hayan
      # CORRIDO. Un pytest que colecta cero por un skip sale con codigo 0 y se
      # lee igual que un verde -- ya paso en esta familia, con un filtro que no
      # matcheaba nada.
      - name: Confirmar que el gate de PostgreSQL corrio
        run: |
          # `pipefail` porque el `tee` se come el codigo de salida de pytest:
          # sin esto, un gate en rojo llega aca como exito.
          set -o pipefail
          pytest tests/test_postgres_real.py -q --no-cov -p no:cacheprovider \
            | tee /tmp/pg_gate.txt

          # Van como `if`, no como `grep ... && { exit 1; }`: con `set -e`, ese
          # compound devuelve el fallo del grep cuando NO matchea -- o sea en el
          # caso bueno -- y el paso se cae solo.
          if ! grep -qE '[0-9]+ passed' /tmp/pg_gate.txt; then
            echo "el gate de PostgreSQL no corrio ningun test"
            exit 1
          fi
          if grep -q 'skipped' /tmp/pg_gate.txt; then
            echo "el gate de PostgreSQL se salteo: falta DATABASE_URL"
            exit 1
          fi
          echo "OK: el gate corrio contra PostgreSQL real"

  # La otra mitad de la matriz de la F3. Este motor lo consumen Gestiolibra y
  # MedLibra, que **hoy corren SQLite en produccion**: una suite que solo pase
  # con el servicio PostgreSQL del CI arriba no dice nada sobre lo desplegado.
  # Sin `DATABASE_URL` los tests que piden PostgreSQL se saltean y el resto
  # corre sobre SQLite, que es la configuracion real de los productos.
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      # Sin `DATABASE_URL` a proposito: es la unica diferencia con el job de
      # arriba, y la unica razon por la que este job existe.
      - name: Run tests (SQLite)
        run: pytest -v --cov --cov-report=term-missing

  # F2 (2026-09-05): que el CI ponga rojo un commit con un secreto. Barre los
  # commits del PR (no toda la historia) con la configuracion de
  # `.gitleaks.toml` en la raiz, que exime `tests/` porque ahi viven las
  # contrasenas de prueba de la suite. Job independiente: corre en paralelo y
  # su rojo no se mezcla con el de la suite.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
