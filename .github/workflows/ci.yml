name: CI

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: libragenda
          POSTGRES_USER: libragenda_ci
          POSTGRES_PASSWORD: libragenda_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libragenda_ci -d libragenda"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://libragenda_ci:libragenda_ci_only@localhost:5432/libragenda

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
